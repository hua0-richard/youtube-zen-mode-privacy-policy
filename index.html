<script>
  /* Applied before the first paint, so a reader who chose a theme does not
     watch the other one flash past. It is inline because a file would be one
     more round trip in front of the paint it exists to beat, and it is the
     only script on the site that is not a module. */
  try {
    var t = localStorage.getItem("ut-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
  document.documentElement.className += " js";
</script>
